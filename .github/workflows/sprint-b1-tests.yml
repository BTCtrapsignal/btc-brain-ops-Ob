name: Sprint B-1 Tests

on:
  push:
    branches:
      - sprint-b1
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          # Base project dependencies
          pip install -r requirements.txt

          # Sprint B-1 additional dependencies
          if [ -f requirements-sprint-b1.txt ]; then
            pip install -r requirements-sprint-b1.txt
          fi

      - name: Run Sprint B-1 test suite
        run: |
          python -m pytest tests/test_mirror.py -v
